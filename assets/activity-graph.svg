<svg width="800" height="260" viewBox="0 0 800 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes drawChartLine {
      from { stroke-dashoffset: 1082; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes wipeChartArea {
      from { width: 0px; }
      to { width: 715px; }
    }
    @keyframes popChartPoint {
      0% { opacity: 0; transform: scale(0); }
      70% { opacity: 1; transform: scale(1.35); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes pulseActivePoint {
      0% { r: 3px; }
      50% { r: 4.5px; filter: drop-shadow(0 0 2px #ffffff); }
      100% { r: 3px; }
    }
    .chart-line {
      stroke-dasharray: 1082;
      stroke-dashoffset: 1082;
      animation: drawChartLine 2.4s ease-in-out both;
    }
    .wipe-rect {
      animation: wipeChartArea 2.4s ease-in-out both;
    }
    .chart-point {
      opacity: 0;
      animation: popChartPoint 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) both, pulseActivePoint 2.8s ease-in-out 2.4s infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .chart-line { stroke-dashoffset: 0; animation: none; }
      .wipe-rect { width: 715px; animation: none; }
      .chart-point { opacity: 1; transform: none; animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="chartAreaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <clipPath id="graphWipeClip">
      <rect class="wipe-rect" x="60" y="0" width="0" height="260" />
    </clipPath>
  </defs>

  <!-- Card Background -->
