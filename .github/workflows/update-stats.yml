name: Update Dynamic Stats Theme

on:
  schedule:
    - cron: "0 */6 * * *"     # UTC 00:00 06:00 12:00 18:00 → IST 05:30 11:30 17:30 23:30
    - cron: "30 18 * * *"     # UTC 18:30 → IST 00:00 midnight
  workflow_dispatch:
    inputs:
      streak_override:
        description: "Override streak value (leave empty for auto-detect)"
        required: false
        default: ""
      dry_run:
        description: "Dry run — show output without writing files"
        type: boolean
        default: false
      simulate_date:
        description: "Simulate date for theme preview (YYYY-MM-DD or YYYY-MM-DDTHH:MM)"
        required: false
        default: ""
      theme_override:
        description: "Force a specific theme by name (e.g. diwali, blue, christmas)"
        required: false
        default: ""
      skip_pings:
        description: "Skip project status URL pings"
        type: boolean
        default: false
      skip_traffic:
        description: "Skip GitHub Traffic API fetch"
        type: boolean
        default: false
      force_update:
        description: "Force-write README even if content is unchanged"
        type: boolean
        default: false

concurrency:
  group: profile-update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update-stats:
    name: "🎨 Update Profile"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Mask secret before any output
        run: |
          if [ -n "$SECRET_MMDD" ]; then
            echo "::add-mask::$SECRET_MMDD"
          fi
          if [ -n "$SECRET_SALT" ]; then
            echo "::add-mask::$SECRET_SALT"
          fi
        env:
          SECRET_MMDD: ${{ secrets.SECRET_MMDD }}
          SECRET_SALT: ${{ secrets.SECRET_SALT }}

      - name: Run Phantom Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          SECRET_MMDD: ${{ secrets.SECRET_MMDD }}
          SECRET_SALT: ${{ secrets.SECRET_SALT }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GITHUB_USERNAME: Unknown-2829
          README_PATH: README.md
          # Inputs passed via env — never interpolated directly into shell
          INPUT_STREAK_OVERRIDE: ${{ github.event.inputs.streak_override }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_SIMULATE_DATE: ${{ github.event.inputs.simulate_date }}
          INPUT_THEME_OVERRIDE: ${{ github.event.inputs.theme_override }}
          INPUT_SKIP_PINGS: ${{ github.event.inputs.skip_pings }}
          INPUT_SKIP_TRAFFIC: ${{ github.event.inputs.skip_traffic }}
          INPUT_FORCE_UPDATE: ${{ github.event.inputs.force_update }}
        run: |
          # Build flag array safely — no direct input interpolation into shell
          FLAGS=()
          [ "$INPUT_DRY_RUN"      = "true" ] && FLAGS+=(--dry-run)
          [ "$INPUT_SKIP_PINGS"   = "true" ] && FLAGS+=(--skip-pings)
          [ "$INPUT_SKIP_TRAFFIC" = "true" ] && FLAGS+=(--skip-traffic)
          [ "$INPUT_FORCE_UPDATE" = "true" ] && FLAGS+=(--force)
          [ -n "$INPUT_STREAK_OVERRIDE" ] && FLAGS+=(--streak "$INPUT_STREAK_OVERRIDE")
          [ -n "$INPUT_SIMULATE_DATE"   ] && FLAGS+=(--date   "$INPUT_SIMULATE_DATE")
          [ -n "$INPUT_THEME_OVERRIDE"  ] && FLAGS+=(--theme  "$INPUT_THEME_OVERRIDE")
          python phantom_engine.py "${FLAGS[@]}"

      - name: Commit and push changes
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md assets/
          # Add each state file individually — skip any that don't exist yet
          for f in .streak_state.json .project_status.json \
                   .repo_meta.json .run_state.json .traffic_summary.json; do
            [ -f "$f" ] && git add -f "$f" || true
          done
          if git diff --quiet --cached; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "🎨 Auto-update stats theme based on streak"
          # Push directly — concurrency lock means no remote divergence.
          # Only pull+rebase if push is genuinely rejected.
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $i failed, pulling and retrying..."
            git fetch origin
            git rebase origin/main || { git rebase --abort; }
            sleep $((i * 5))
          done
          echo "Push failed after 3 attempts" >&2
          exit 1

