name: Dynamic Profile Updater

on:
  schedule:
    - cron: "30 0,6,12,18 * * *"  # UTC 00:30 06:30 12:30 18:30 → IST 06:00 12:00 18:00 00:00
  workflow_dispatch:
    inputs:
      streak_override:
        description: "Override streak value (leave empty for auto-detect)"
        required: false
        default: ""
      dry_run:
        description: "Dry run — show output without writing files"
        type: boolean
        default: false
      simulate_date:
        description: "Simulate date for theme preview (YYYY-MM-DD or YYYY-MM-DDTHH:MM)"
        required: false
        default: ""
      theme_override:
        description: "Force a specific theme by name (e.g. diwali, blue, christmas)"
        required: false
        default: ""
      skip_pings:
        description: "Skip project status URL pings"
        type: boolean
        default: false
      skip_traffic:
        description: "Skip GitHub Traffic API fetch"
        type: boolean
        default: false
      force_update:
        description: "Force-write README even if content is unchanged"
        type: boolean
        default: false

concurrency:
  group: profile-update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update-profile:
    name: "⚡ Update Profile & Status"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Mask secret before any output
        run: |
          if [ -n "$SECRET_MMDD" ]; then
            echo "::add-mask::$SECRET_MMDD"
          fi
          if [ -n "$SECRET_SALT" ]; then
            echo "::add-mask::$SECRET_SALT"
          fi
        env:
          SECRET_MMDD: ${{ secrets.SECRET_MMDD }}
          SECRET_SALT: ${{ secrets.SECRET_SALT }}

      - name: Run Phantom Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          SECRET_MMDD: ${{ secrets.SECRET_MMDD }}
          SECRET_SALT: ${{ secrets.SECRET_SALT }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GITHUB_USERNAME: Unknown-2829
          README_PATH: README.md
          # Inputs passed via env — never interpolated directly into shell
          INPUT_STREAK_OVERRIDE: ${{ github.event.inputs.streak_override }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_SIMULATE_DATE: ${{ github.event.inputs.simulate_date }}
          INPUT_THEME_OVERRIDE: ${{ github.event.inputs.theme_override }}
          INPUT_SKIP_PINGS: ${{ github.event.inputs.skip_pings }}
          INPUT_SKIP_TRAFFIC: ${{ github.event.inputs.skip_traffic }}
          INPUT_FORCE_UPDATE: ${{ github.event.inputs.force_update }}
        run: |
          # Build flag array safely — no direct input interpolation into shell
          FLAGS=()
          [ "$INPUT_DRY_RUN"      = "true" ] && FLAGS+=(--dry-run)
          [ "$INPUT_SKIP_PINGS"   = "true" ] && FLAGS+=(--skip-pings)
          [ "$INPUT_SKIP_TRAFFIC" = "true" ] && FLAGS+=(--skip-traffic)
          [ "$INPUT_FORCE_UPDATE" = "true" ] && FLAGS+=(--force)
          [ -n "$INPUT_STREAK_OVERRIDE" ] && FLAGS+=(--streak "$INPUT_STREAK_OVERRIDE")
          [ -n "$INPUT_SIMULATE_DATE"   ] && FLAGS+=(--date   "$INPUT_SIMULATE_DATE" --dry-run)
          [ -n "$INPUT_THEME_OVERRIDE"  ] && FLAGS+=(--theme  "$INPUT_THEME_OVERRIDE")
          python phantom_engine.py "${FLAGS[@]}"

      - name: Commit and push changes
        if: ${{ github.event.inputs.dry_run != 'true' && !github.event.inputs.simulate_date }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          SECRET_MMDD: ${{ secrets.SECRET_MMDD }}
          SECRET_SALT: ${{ secrets.SECRET_SALT }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GITHUB_USERNAME: Unknown-2829
          README_PATH: README.md
          INPUT_STREAK_OVERRIDE: ${{ github.event.inputs.streak_override }}
          INPUT_THEME_OVERRIDE: ${{ github.event.inputs.theme_override }}
          INPUT_SKIP_PINGS: ${{ github.event.inputs.skip_pings }}
          INPUT_SKIP_TRAFFIC: ${{ github.event.inputs.skip_traffic }}
          INPUT_FORCE_UPDATE: ${{ github.event.inputs.force_update }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          COMMIT_STATUS="no_changes"
          stage_and_commit() {
            git add README.md assets/ config/
            for f in data/*.json; do
              [ -f "$f" ] && git add -f "$f" || true
            done
            if git diff --quiet --cached; then
              echo "Nothing to commit."
              COMMIT_STATUS="no_changes"
              return 0
            fi
            if [ -f .commit_msg ]; then
              git commit -F .commit_msg
              rm -f .commit_msg
            else
              git commit -m "⚡ Update profile stats, themes & status"
            fi
            COMMIT_STATUS="committed"
            return 0
          }

          BASE_REMOTE=$(git rev-parse origin/main)
          stage_and_commit
          if [ "$COMMIT_STATUS" = "no_changes" ]; then
            echo "No changes needed."
            exit 0
          fi

          # Push with retry — only reset and regenerate if origin/main actually advanced
          for i in 1 2 3; do
            if [ "$COMMIT_STATUS" = "committed" ] && git push origin HEAD:main; then
              echo "Push succeeded on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed." >&2
            if [ "$i" -lt 3 ]; then
              sleep $((i * 5))
              if git fetch origin main; then
                NEW_REMOTE=$(git rev-parse origin/main)
                if [ "$NEW_REMOTE" != "$BASE_REMOTE" ]; then
                  echo "Remote main advanced ($BASE_REMOTE -> $NEW_REMOTE); resetting and regenerating..."
                  BASE_REMOTE="$NEW_REMOTE"
                  git reset --hard origin/main
                  FLAGS=()
                  [ "$INPUT_SKIP_PINGS"   = "true" ] && FLAGS+=(--skip-pings)
                  [ "$INPUT_SKIP_TRAFFIC" = "true" ] && FLAGS+=(--skip-traffic)
                  [ "$INPUT_FORCE_UPDATE" = "true" ] && FLAGS+=(--force)
                  [ -n "$INPUT_STREAK_OVERRIDE" ] && FLAGS+=(--streak "$INPUT_STREAK_OVERRIDE")
                  [ -n "$INPUT_THEME_OVERRIDE"  ] && FLAGS+=(--theme  "$INPUT_THEME_OVERRIDE")
                  python phantom_engine.py "${FLAGS[@]}"
                  stage_and_commit
                  if [ "$COMMIT_STATUS" = "no_changes" ]; then
                    echo "Remote main already contains the desired state after regeneration."
                    exit 0
                  fi
                fi
              fi
            fi
          done
          echo "Push failed after 3 attempts" >&2
          exit 1


